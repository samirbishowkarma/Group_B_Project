<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Technologia</title>
  <meta name="description" content="Direct messaging with other Technologia members.">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="chat.css">
  <script>window.tgImgErr=function(el){el.onerror=null;el.style.background='linear-gradient(150deg,#182238,#0b0e17)';el.removeAttribute('src');};</script>
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
            <a class="brand" href="Home.html"><span class="logo-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.6v2"/><circle cx="12" cy="2" r="1" fill="currentColor" stroke="none"/><rect x="4.5" y="6.6" width="15" height="11.2" rx="4"/><rect x="7.4" y="10.2" width="9.2" height="3.3" rx="1.65" fill="currentColor" stroke="none"/><path d="M2.6 10.9v3M21.4 10.9v3"/><path d="M10 17.8v3M14 17.8v3"/></svg></span>Techno<b>logia</b></a>
      <nav class="nav-links" aria-label="Primary">
        <a href="Home.html">Home</a>
        <a href="sell.html">Sell</a>
        <a href="marketplace.html">Marketplace</a>
        <a href="product.html">Product</a>
        <a href="chat.html" class="active">Chat</a>
        <a href="discussion.html">Discuss</a>
        <a href="profile.html">Profile</a>
      </nav>
      <div class="nav-actions">
        <a class="icon-btn js-auth-link" href="login.html" aria-label="Account" title="Account"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
        <button class="icon-btn nav-toggle" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      </div>
    </div>
  </header>

  <div id="chatPage">

    <div id="chatAuth" class="chat-auth" style="display:none;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <h3>Sign in to chat</h3>
      <p style="color:var(--muted);margin:0;">You need an account to send and receive messages.</p>
      <a class="btn btn-primary btn-sm" href="login.html">Sign In</a>
    </div>

    <div class="chat-layout">
      <!-- Sidebar -->
      <aside class="chat-sidebar">
        <div class="chat-sidebar-head">
          <h2>Messages <button id="chatNewBtn" class="chat-new-btn" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> New</button></h2>
          <div class="chat-search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input id="chatSearch" type="text" placeholder="Search conversations..." aria-label="Search conversations">
          </div>
        </div>
        <div id="chatList" class="chat-list"></div>
        <div id="chatStartForm" class="chat-start-form">
          <input id="newChatName" class="field" type="text" placeholder="Enter user name..." aria-label="User name">
          <button id="newChatSubmit" class="btn btn-primary btn-sm" type="button">Start Conversation</button>
        </div>
      </aside>


      <section class="chat-main" id="chatMain" style="display:none;">
        <div class="chat-header">
          <button id="chatBackBtn" class="chat-back-btn" aria-label="Back to conversations">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </button>
          <div id="chatHeaderInfo"></div>
        </div>
        <div id="chatProductContext" class="chat-product-context" hidden></div>
        <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
        <div class="chat-input">
          <input id="chatInput" type="text" maxlength="1000" placeholder="Type a message..." aria-label="Message input">
          <button id="chatSendBtn" class="chat-send-btn" type="button" aria-label="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </section>


      <div id="chatEmpty" class="chat-empty">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <h3>Select a conversation or start a new one</h3>
        <p>Your messages will appear here</p>
      </div>
    </div>
  </div>

  <footer class="site-footer"><div class="wrap"><div class="foot-bottom foot-bottom--minimal"><span>&copy; 2026 Technologia.</span><span><a href="Home.html">Home</a> &middot; <a href="marketplace.html">Marketplace</a> &middot; <a href="discussion.html">Discuss</a></span></div></div></footer>
  <div class="toast-host"></div>
<script src="jquery.min.js"></script>
<script src="base.js"></script>
<script src="chat.js"></script>
</body>
</html>
