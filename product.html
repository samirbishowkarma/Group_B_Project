<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View product details and contact the seller directly on Technologia.">
  <title>Product — Technologia</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="product.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="Home.html" aria-label="Technologia home">
        <span class="logo-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.6v2"/><circle cx="12" cy="2" r="1" fill="currentColor" stroke="none"/><rect x="4.5" y="6.6" width="15" height="11.2" rx="4"/><rect x="7.4" y="10.2" width="9.2" height="3.3" rx="1.65" fill="currentColor" stroke="none"/><path d="M2.6 10.9v3M21.4 10.9v3"/><path d="M10 17.8v3M14 17.8v3"/></svg>
        </span>
        Techno<b>logia</b>
      </a>

      <nav class="nav-links" aria-label="Primary navigation">
        <a href="Home.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="marketplace.html">Marketplace</a>
        <a href="chat.html">Chat</a>
        <a href="discussions.html">Discuss</a>
        <a href="sell.html">Sell</a>
      </nav>

      <div class="nav-actions">
        <a class="icon-btn js-auth-link" href="login.html" aria-label="Your account">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
        <a class="icon-btn" href="chat.html" aria-label="Messages">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
        </a>
        <button class="icon-btn nav-toggle" type="button" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <nav class="crumbs product-crumbs" aria-label="Breadcrumb">
        <a href="Home.html">Home</a>
        <span aria-hidden="true">/</span>
        <a href="shop.html">Shop</a>
        <span aria-hidden="true">/</span>
        <span id="crumbName" aria-current="page">Product</span>
      </nav>

      <section class="section section--pdp" aria-labelledby="productTitle">
        <div class="pdp" id="pdp" aria-live="polite">
          <div class="product-loading">Loading product details…</div>
        </div>
      </section>

      <section class="section section--flush related-products" id="relatedWrap" hidden aria-labelledby="relatedTitle">
        <div class="section-head">
          <div>
            <span class="eyebrow">Worth a look</span>
            <h2 id="relatedTitle">Similar products</h2>
            <p>More items from the same category.</p>
          </div>
          <a class="btn btn-ghost btn-sm" href="shop.html">Browse all products</a>
        </div>
        <div class="product-grid" id="related"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="foot-bottom foot-bottom--minimal">
        <span>&copy; 2026 Technologia. Built for makers.</span>
        <span><a href="Home.html">Home</a> · <a href="marketplace.html">Marketplace</a> · <a href="chat.html">Chat</a></span>
      </div>
    </div>
  </footer>

  <div class="toast-host" aria-live="polite"></div>
  <script src="jquery.min.js"></script>
  <script src="base.js"></script>
  <script src="product.js"></script>
</body>
</html>
